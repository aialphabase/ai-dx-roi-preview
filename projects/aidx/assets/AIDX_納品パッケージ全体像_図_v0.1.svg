  <text x="1282" y="1376" font-family="sans-serif" font-size="13" fill="#c9c3ba">表紙図・議題図・照合負荷図・</text>
  <text x="1282" y="1396" font-family="sans-serif" font-size="13" fill="#c9c3ba">利用タイムライン図</text>
  <text x="1282" y="1420" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>

  <!-- footer -->
  <text x="70" y="1508" font-family="sans-serif" font-size="15" fill="#a8a29b">読み方: いま最優先は①「音声処理の運用構築」。ここが固まると中核②の5PJがすべて実運用に乗る(7/24目標の前提)。③④は仕組みとしては用意済み、⑤の営業・導入支援ツールが次の未着手ゾーン。</text>
  <text x="70" y="1534" font-family="sans-serif" font-size="12" fill="#6f6a63">出典: AIDX引き継ぎパック(01〜07)/ Notion移植用メモ v0.2(2026-07-23)/ 音声文字起こし環境制約メモ v0.2。状態は2026-07-23時点。</text>
