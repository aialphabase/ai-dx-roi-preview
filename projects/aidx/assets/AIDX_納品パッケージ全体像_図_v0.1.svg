  <!-- 4 chips w=375, step 390, x: 90,480,870,1260 -->
  <rect x="90" y="810" width="375" height="130" rx="12" fill="#15201a"/>
  <circle cx="116" cy="846" r="7" fill="#7fc98b"/>
  <text x="134" y="851" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">QA自動チェック</text>
  <text x="112" y="886" font-family="sans-serif" font-size="13" fill="#c9c3ba">各PJに内蔵。下書きと一緒に</text>
  <text x="112" y="906" font-family="sans-serif" font-size="13" fill="#c9c3ba">自動で監査結果を提示</text>
  <text x="112" y="930" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>

  <rect x="480" y="810" width="375" height="130" rx="12" fill="#15201a"/>
  <circle cx="506" cy="846" r="7" fill="#7fc98b"/>
