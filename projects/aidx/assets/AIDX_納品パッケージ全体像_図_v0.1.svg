  <text x="112" y="1376" font-family="sans-serif" font-size="13" fill="#c9c3ba">商談・導入初日の説明を</text>
  <text x="112" y="1396" font-family="sans-serif" font-size="13" fill="#c9c3ba">同じ型で進めるための台本</text>
  <text x="112" y="1420" font-family="sans-serif" font-size="12" font-weight="700" fill="#a8a29b">未着手</text>

  <rect x="480" y="1300" width="375" height="130" rx="12" fill="#1a1a1e"/>
  <circle cx="506" cy="1336" r="7" fill="#6f6a63"/>
  <text x="524" y="1341" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">企業ヒアリングシート</text>
  <text x="502" y="1376" font-family="sans-serif" font-size="13" fill="#c9c3ba">導入前に業務・用語・</text>
  <text x="502" y="1396" font-family="sans-serif" font-size="13" fill="#c9c3ba">体制を聞き取るシート</text>
  <text x="502" y="1420" font-family="sans-serif" font-size="12" font-weight="700" fill="#a8a29b">未着手</text>

  <rect x="870" y="1300" width="375" height="130" rx="12" fill="#1a1a1e"/>
  <circle cx="896" cy="1336" r="7" fill="#6f6a63"/>
