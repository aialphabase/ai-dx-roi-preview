  <text x="892" y="1376" font-family="sans-serif" font-size="13" fill="#c9c3ba">12週間の導入支援の成果を</text>
  <text x="892" y="1396" font-family="sans-serif" font-size="13" fill="#c9c3ba">顧客へ報告する定型</text>
  <text x="892" y="1420" font-family="sans-serif" font-size="12" font-weight="700" fill="#a8a29b">未着手</text>

