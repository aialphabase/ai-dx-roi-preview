  <text x="1057" y="662" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">ナレッジ整備</text>
  <text x="1057" y="686" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>
  <!-- PJ-05 -->
  <rect x="1350" y="565" width="300" height="130" rx="12" fill="#15201a"/>
  <circle cx="1376" cy="600" r="7" fill="#7fc98b"/>
  <text x="1394" y="605" font-family="sans-serif" font-size="13" font-weight="700" fill="#7fc98b">PJ-05 · v0.2</text>
  <text x="1372" y="640" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">メール・</text>
  <text x="1372" y="662" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">問い合わせ回答</text>
  <text x="1372" y="686" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>

  <!-- ============ Band 3: 品質 ============ -->
  <rect x="60" y="740" width="1680" height="225" rx="18" fill="#131316" stroke="#2c2c31" stroke-width="1"/>
