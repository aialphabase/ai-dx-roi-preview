  <text x="427" y="662" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">入力支援</text>
  <text x="427" y="686" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>
  <!-- PJ-03 -->
