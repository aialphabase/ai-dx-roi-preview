  <text x="112" y="686" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>
  <!-- PJ-02 -->
  <rect x="405" y="565" width="300" height="130" rx="12" fill="#15201a"/>
  <circle cx="431" cy="600" r="7" fill="#7fc98b"/>
