<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1560" role="img" aria-label="AIDX立上げパック(標準納品キット)の中身と、そろえるべきものの全体像図">
  <rect width="1800" height="1560" rx="28" fill="#0c0c0e"/>

  <!-- header -->
  <text x="70" y="76" font-family="sans-serif" font-size="15" font-weight="700" fill="#ff8a3d" letter-spacing="2">納品パッケージ 全体像</text>
  <text x="70" y="126" font-family="sans-serif" font-size="33" font-weight="700" fill="#f5f5f5">AIDX立上げパック(標準納品キット)の中身と、そろえるべきもの</text>
  <text x="70" y="163" font-family="sans-serif" font-size="16" fill="#a8a29b">目標: 標準納品キット完成 7/30 → 商品確定(AIDX立上げパック248)8/07。顧客がAIDXを導入し、12週間の伴走で定着させるための一式。</text>

  <!-- legend -->
  <circle cx="82" cy="206" r="7" fill="#7fc98b"/>
  <text x="98" y="211" font-family="sans-serif" font-size="14" fill="#c9c3ba">そろっている(最新版あり)</text>
  <circle cx="382" cy="206" r="7" fill="#ff8a3d"/>
  <text x="398" y="211" font-family="sans-serif" font-size="14" fill="#c9c3ba">構築中・検証中(いま最優先)</text>
  <circle cx="712" cy="206" r="7" fill="#e6c34a"/>
  <text x="728" y="211" font-family="sans-serif" font-size="14" fill="#c9c3ba">設計のみ・実データ未検証</text>
  <circle cx="1022" cy="206" r="7" fill="#6f6a63"/>
  <text x="1038" y="211" font-family="sans-serif" font-size="14" fill="#c9c3ba">未着手</text>

  <!-- ============ Band 1: 基盤 ============ -->
  <rect x="60" y="250" width="1680" height="225" rx="18" fill="#131316" stroke="#2c2c31" stroke-width="1"/>
  <text x="90" y="295" font-family="sans-serif" font-size="19" font-weight="700" fill="#ff8a3d">① 動かす前提・基盤 ― これがそろうと中核5PJが動き出す</text>

  <!-- chip: 音声処理(bottleneck) -->
  <rect x="90" y="320" width="760" height="130" rx="12" fill="#221a13" stroke="#ff8a3d" stroke-width="2"/>
  <circle cx="118" cy="356" r="8" fill="#ff8a3d"/>
  <text x="138" y="361" font-family="sans-serif" font-size="16" font-weight="700" fill="#f5f5f5">音声処理の運用構築(文字起こし経路の確定)</text>
  <text x="138" y="392" font-family="sans-serif" font-size="13" fill="#c9c3ba">音声→テキスト化の経路が固まると、PJ1〜5がすべて埋まる想定(7/24目標の前提)</text>
  <text x="138" y="428" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffb27f">構築中・検証中 ― 最大のボトルネック(7/23 リアルタイム音声で検証中)</text>

  <!-- chip: 案件フォルダテンプレ -->
  <rect x="880" y="320" width="760" height="130" rx="12" fill="#1a1a1e"/>
  <circle cx="908" cy="356" r="8" fill="#6f6a63"/>
  <text x="928" y="361" font-family="sans-serif" font-size="16" font-weight="700" fill="#f5f5f5">Cowork案件フォルダテンプレート本体</text>
  <text x="928" y="392" font-family="sans-serif" font-size="13" fill="#c9c3ba">SOP(手順書)・入力テンプレート・各PJの格納構成</text>
  <text x="928" y="428" font-family="sans-serif" font-size="13" font-weight="700" fill="#a8a29b">未着手(顧客向け「表紙」のみ完成)</text>

