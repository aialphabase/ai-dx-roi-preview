  <circle cx="746" cy="600" r="7" fill="#7fc98b"/>
  <text x="764" y="605" font-family="sans-serif" font-size="13" font-weight="700" fill="#7fc98b">PJ-03 · v0.2</text>
  <text x="742" y="640" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">営業資料・</text>
  <text x="742" y="662" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">提案書作成</text>
  <text x="742" y="686" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>
