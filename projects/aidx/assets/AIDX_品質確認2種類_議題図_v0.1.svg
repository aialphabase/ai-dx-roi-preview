<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>品質確認は2種類ある:企画書と今回方針の一致状況</title>
<desc>企画書に書かれた品質確認を2種類に分け、テンプレのQAは今回の方針と一致済み、3か月の継続レビューは未決定であることを示す図。</desc>

<rect x="16" y="16" width="1568" height="868" rx="36" fill="#0c0c0e" stroke="#2a2a2e" stroke-width="1.5"/>

<text x="80" y="86" font-family="sans-serif" font-size="15" font-weight="700" fill="#ff8a3d" letter-spacing="2">次回議題</text>
<text x="80" y="128" font-family="sans-serif" font-size="30" font-weight="700" fill="#f5f5f5">「品質確認」は企画書に2種類ある</text>
<text x="80" y="158" font-family="sans-serif" font-size="16" fill="#9a9a9e">1つは今回の方針とすでに一致、もう1つはまだ決まっていない</text>

<rect x="80" y="200" width="700" height="500" rx="24" fill="#141310" stroke="#3a342c" stroke-width="1.5"/>
<text x="112" y="248" font-family="sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">① テンプレの品質確認</text>
<text x="112" y="274" font-family="sans-serif" font-size="14" fill="#9a9a9e">プロンプト自体を1回だけ検証する工程</text>

<rect x="590" y="222" width="150" height="40" rx="20" fill="#173a24" stroke="#3fae6a" stroke-width="1.5"/>
<text x="665" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#5fd68a">一致済み ✓</text>

<line x1="112" y1="296" x2="748" y2="296" stroke="#2a2a2e"/>

<text x="112" y="336" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff8a3d">企画書(21章)</text>
<text x="112" y="362" font-family="sans-serif" font-size="16" fill="#e5e0d8">納品前に西村・渡部が</text>
<text x="112" y="386" font-family="sans-serif" font-size="16" fill="#e5e0d8">プロンプト・FAQ品質を確認</text>

<text x="112" y="440" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff8a3d">今回の実装</text>
<text x="112" y="466" font-family="sans-serif" font-size="16" fill="#e5e0d8">MDスキル + 再現性テストで</text>
<text x="112" y="490" font-family="sans-serif" font-size="16" fill="#e5e0d8">同じ役割を代替</text>

<rect x="112" y="600" width="636" height="70" rx="14" fill="#0f150f" stroke="#2f4a37" stroke-width="1"/>
<text x="132" y="642" font-family="sans-serif" font-size="15" fill="#8fd6a8">→ ここは今のやり方のままで問題なし</text>

<rect x="820" y="200" width="700" height="500" rx="24" fill="#141310" stroke="#3a342c" stroke-width="1.5"/>
<text x="852" y="248" font-family="sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">② 3か月の継続レビュー</text>
<text x="852" y="274" font-family="sans-serif" font-size="14" fill="#9a9a9e">伴走型コンサルとしての人の関与</text>

<rect x="1330" y="222" width="150" height="40" rx="20" fill="#3a2c14" stroke="#ff8a3d" stroke-width="1.5"/>
<text x="1405" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#ff8a3d">未決定 ?</text>

<line x1="852" y1="296" x2="1488" y2="296" stroke="#2a2a2e"/>

<text x="852" y="336" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff8a3d">企画書(1・2章)</text>
<text x="852" y="362" font-family="sans-serif" font-size="16" fill="#e5e0d8">「3か月伴走型」</text>
<text x="852" y="386" font-family="sans-serif" font-size="16" fill="#e5e0d8">「経営課題解決を売る」</text>

<text x="852" y="440" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff8a3d">今回の方針</text>
<text x="852" y="466" font-family="sans-serif" font-size="16" fill="#e5e0d8">コンサルではない</text>
<text x="852" y="490" font-family="sans-serif" font-size="16" fill="#e5e0d8">Claude Cowork中心</text>

<rect x="852" y="600" width="636" height="70" rx="14" fill="#1a140c" stroke="#5a3f1f" stroke-width="1"/>
<text x="872" y="642" font-family="sans-serif" font-size="15" fill="#e0a35f">→ 今日ここをPM・CEOで決める</text>

<rect x="80" y="726" width="1440" height="70" rx="16" fill="#171310" stroke="#ff8a3d" stroke-width="1.5"/>
<text x="112" y="768" font-family="sans-serif" font-size="17" font-weight="700" fill="#f5f5f5">決めること:②をどこまでCoworkに置き換え、どこまで人の伴走を残すか</text>

<text x="80" y="838" font-family="sans-serif" font-size="14" fill="#7a7a7e">再発防止:「決まっていたと思う」を防ぐため、会議ごとに個人メモ・tldv要約を都度アップデートする</text>
</svg>
