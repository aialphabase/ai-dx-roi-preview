<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIDXパック追加・手順設定</title>
<style>
  body{margin:0;background:#f7f5f0;color:#26302b;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
  .wrap{padding:22px}.ey{font-size:11px;letter-spacing:.16em;color:#b08a4f;font-weight:700}
  h1{font-size:22px;line-height:1.35;margin:8px 0}.lead{color:#6e7a72;margin:0 0 18px}
  .step{background:#fff;border:1px solid #e3dfd6;border-radius:12px;padding:16px;margin:12px 0}
  .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#244d3e;color:#fff;font-weight:700;font-size:12px;margin-right:7px}
  .ui{margin:12px 0 4px;border:1px solid #d8d2c6;border-radius:10px;background:#fbfaf7;padding:12px}.ui b{display:block;font-size:16px}.path{color:#244d3e;font-weight:700}
  .note{font-size:12px;color:#6e7a72;margin-top:5px}.warn{background:#e7eee9;border-radius:9px;padding:12px;font-size:13px;margin-top:16px}
</style>
<body><main class="wrap">
  <div class="ey">CLAUDE DESKTOP / COWORK</div>
  <h1>AIDXパック追加・手順設定</h1>
  <p class="lead">対象プロジェクトを開いて、右側の2か所を設定します。</p>
  <section class="step"><b><span class="num">1</span>「コンテキスト」にパックを追加</b><div class="ui"><b>コンテキスト</b><span class="path">「ファイルを追加」</span> を選び、AIDXパックの参照ファイルを追加します。</div><p class="note">追加したファイルは、このプロジェクト内で参照されます。</p></section>
  <section class="step"><b><span class="num">2</span>「手順」に会社設定を保存</b><div class="ui"><b>手順</b><span class="path">「指示を編集」</span> を選び、会社名・署名・文体・禁止語などを保存します。</div><p class="note">設定内容は、このプロジェクト内の以後の会話に適用されます。</p></section>
  <div class="warn">完了後は実機テストを1本実施します。出力は下書きとして確認し、最終判断は人が行います。</div>
</main></body></html>
