<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="AIDXの公開版と関連シミュレーションをまとめるプロジェクト入口です。">
  <title>AIDX｜プロジェクト入口</title>
  <style>
    :root { color-scheme: dark; --bg:#07111d; --text:#f3f8fb; --sub:#9db3c4; --blue:#59a8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body { display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, #173f69, transparent 38rem), var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
    main { width: min(760px,100%); padding: clamp(28px,6vw,58px); border: 1px solid rgba(157,179,196,.2); border-radius: 24px; background: rgba(16,34,52,.88); box-shadow: 0 30px 80px rgba(0,0,0,.25); }
    .status { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 18px 0 12px; font-size: clamp(42px,9vw,76px); letter-spacing: -.05em; }
    p { color: var(--sub); line-height: 1.8; }
    .links { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin: 28px 0; }
    a { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 0 16px; border: 1px solid rgba(157,179,196,.25); border-radius: 12px; color: var(--text); text-decoration: none; }
    .primary { background: linear-gradient(110deg,#247bd5,#2d9fc6); border-color: transparent; font-weight: 700; }
    .back { min-height: 44px; justify-content: flex-start; border: 0; padding: 0; color: var(--sub); }
    @media(max-width:600px){ .links { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="status">PROJECT 01 · LIVE</div>
    <h1>AIDX</h1>
    <p>AI DX ROI診断の公開版と、今後追加する診断・シミュレーションの入口です。</p>
    <div class="links">
      <a class="primary" href="../../codex/">Codex版を開く</a>
      <a href="../../claude/">Claude版を開く</a>
    </div>
    <a class="back" href="../../">← プロジェクトハブへ戻る</a>
  </main>
</body>
</html>
