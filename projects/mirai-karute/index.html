<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="ミライカルテの公開準備用スペースです。">
  <title>ミライカルテ｜公開準備スペース</title>
  <style>
    :root { color-scheme: dark; --bg:#07111d; --text:#f3f8fb; --sub:#9db3c4; --accent:#61dfc8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body { display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, #153b50, transparent 38rem), var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
    main { width: min(720px,100%); padding: clamp(28px,6vw,58px); border: 1px solid rgba(157,179,196,.2); border-radius: 24px; background: rgba(16,34,52,.86); box-shadow: 0 30px 80px rgba(0,0,0,.25); }
    .status { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 18px 0 12px; font-size: clamp(38px,8vw,68px); letter-spacing: -.05em; }
    p { color: var(--sub); line-height: 1.8; }
    ul { margin: 26px 0; padding-left: 20px; color: #c4d3df; line-height: 1.9; }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 16px; border: 1px solid rgba(157,179,196,.25); border-radius: 11px; color: var(--text); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="status">STORAGE READY</div>
    <h1>ミライカルテ</h1>
    <p>サイト本体と診断・シミュレーションを安全に追加するための専用収納先を準備しました。</p>
    <ul>
      <li>サイト本体：このフォルダの <code>index.html</code></li>
      <li>関連素材：<code>assets/</code></li>
      <li>診断・シミュレーション：共通の <code>/simulations/</code></li>
    </ul>
    <a href="../../">プロジェクトハブへ戻る</a>
  </main>
</body>
</html>
