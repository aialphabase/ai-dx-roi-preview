name: asset-map-nightly
on:
  schedule:
    - cron: "47 13 * * 1-5"   # 22:47 JST 平日（毎時0分はGitHub混雑で遅延するため半端な時刻に）
  workflow_dispatch:          # 手動実行も可（Actionsタブから）
permissions:
  contents: write
concurrency:
  group: asset-map-nightly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run nightly update
        env:
          ASSET_MAP_MODE: ${{ vars.ASSET_MAP_MODE || 'dry' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
        run: python scripts/update_asset_map.py
      - name: Commit drafts
        run: |
          git config user.name  "asset-map-bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/out
          git diff --cached --quiet || git commit -m "asset-map nightly $(date -u +%F)"
          git push
