<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AIDX Claude Cowork 案件フォルダ表紙</title>
<desc>渡す、任せる、受け取るの3ステップで、PJ-01からPJ-05までの5種類の成果物が同じ型で返ってくることと、追加要件は企画書または追加提案書として人が確認してから着手する運用案を示す表紙図。</desc>

<rect x="16" y="16" width="1568" height="968" rx="36" fill="#0c0c0e" stroke="#2a2a2e" stroke-width="1.5"/>

<text x="80" y="88" font-family="sans-serif" font-size="15" font-weight="700" fill="#ff8a3d" letter-spacing="2">AIDX × CLAUDE COWORK</text>
<text x="80" y="128" font-family="sans-serif" font-size="30" font-weight="700" fill="#f5f5f5">はじめかたは3ステップだけ</text>
<text x="80" y="158" font-family="sans-serif" font-size="16" fill="#9a9a9e">コードも画面操作の学習も不要です。渡す → 任せる → 受け取る、これだけです。</text>

<text x="150" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#ff8a3d">1. 渡す</text>
<text x="735" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#ff8a3d">2. 任せる</text>
<text x="1220" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#ff8a3d">3. 受け取る(下書き)</text>

<rect x="80" y="420" width="340" height="100" rx="22" fill="#f2f2f0"/>
<path d="M 130 518 L 110 548 L 160 518 Z" fill="#f2f2f0"/>
<text x="112" y="462" font-family="sans-serif" font-size="21" font-weight="700" fill="#141414">資料を渡す</text>
<text x="112" y="490" font-family="sans-serif" font-size="15" fill="#5a5a5a">音声・メモ・PDFなど、そのまま</text>

<path d="M 420 470 L 690 470" stroke="#ff8a3d" stroke-width="2.5"/>
<circle cx="420" cy="470" r="4" fill="#ff8a3d"/>

<rect x="690" y="330" width="280" height="280" rx="28" fill="#171310" stroke="#ff8a3d" stroke-width="2"/>
<circle cx="830" cy="420" r="34" fill="#ff8a3d"/>
<g stroke="#171310" stroke-width="3" stroke-linecap="round">
  <line x1="830" y1="400" x2="830" y2="440"/>
  <line x1="810" y1="420" x2="850" y2="420"/>
  <line x1="816" y1="406" x2="844" y2="434"/>
  <line x1="844" y1="406" x2="816" y2="434"/>
</g>
<text x="830" y="490" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#f5f5f5">Claude Cowork</text>
<text x="830" y="518" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b8b0a6">AI初心者を支えるハーネス</text>
<text x="830" y="542" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b8b0a6">毎回同じ手順・同じ型で返す</text>
<text x="830" y="566" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b8b0a6">わからない所は「要確認」で止まる</text>

<g stroke="#ff8a3d" stroke-width="2" fill="none" opacity="0.85">
  <path d="M 970 470 C 1050 470, 1050 212, 1120 212"/>
  <path d="M 970 470 C 1050 470, 1050 334, 1120 334"/>
  <path d="M 970 470 L 1120 470"/>
  <path d="M 970 470 C 1050 470, 1050 592, 1120 592"/>
  <path d="M 970 470 C 1050 470, 1050 714, 1120 714"/>
</g>

<g font-family="sans-serif">
  <rect x="1120" y="160" width="400" height="104" rx="18" fill="#17151b" stroke="#3a342c" stroke-width="1.5"/>
  <rect x="1140" y="180" width="44" height="44" rx="11" fill="#2a1c0e"/>
  <line x1="1150" y1="192" x2="1174" y2="192" stroke="#ff8a3d" stroke-width="3"/>
  <line x1="1150" y1="203" x2="1174" y2="203" stroke="#ff8a3d" stroke-width="3"/>
  <line x1="1150" y1="214" x2="1166" y2="214" stroke="#ff8a3d" stroke-width="3"/>
  <text x="1198" y="196" font-size="18" font-weight="700" fill="#f5f5f5">PJ-01 議事録</text>
  <text x="1198" y="218" font-size="13" fill="#9a9a9e">決定・TODOを整理した下書き</text>
  <text x="1198" y="238" font-size="12" fill="#7a7a7e">対象:全社員/責任者が最終確認</text>

  <rect x="1120" y="282" width="400" height="104" rx="18" fill="#17151b" stroke="#3a342c" stroke-width="1.5"/>
  <rect x="1140" y="302" width="44" height="44" rx="11" fill="#2a1c0e"/>
  <rect x="1150" y="312" width="9" height="9" fill="none" stroke="#ff8a3d" stroke-width="2.2"/>
  <line x1="1164" y1="317" x2="1174" y2="317" stroke="#ff8a3d" stroke-width="3"/>
  <rect x="1150" y="326" width="9" height="9" fill="none" stroke="#ff8a3d" stroke-width="2.2"/>
  <line x1="1164" y1="331" x2="1174" y2="331" stroke="#ff8a3d" stroke-width="3"/>
  <text x="1198" y="318" font-size="18" font-weight="700" fill="#f5f5f5">PJ-02 日報・CRM入力案</text>
  <text x="1198" y="340" font-size="13" fill="#9a9a9e">面談メモから自動で整理</text>
  <text x="1198" y="360" font-size="12" fill="#7a7a7e">対象:営業/入力前に本人が確認</text>

  <rect x="1120" y="404" width="400" height="104" rx="18" fill="#17151b" stroke="#3a342c" stroke-width="1.5"/>
  <rect x="1140" y="424" width="44" height="44" rx="11" fill="#2a1c0e"/>
  <rect x="1150" y="434" width="24" height="18" rx="2" fill="none" stroke="#ff8a3d" stroke-width="2.2"/>
  <line x1="1154" y1="440" x2="1170" y2="440" stroke="#ff8a3d" stroke-width="2"/>
  <line x1="1154" y1="446" x2="1170" y2="446" stroke="#ff8a3d" stroke-width="2"/>
  <text x="1198" y="440" font-size="18" font-weight="700" fill="#f5f5f5">PJ-03 提案書・営業資料</text>
  <text x="1198" y="462" font-size="13" fill="#9a9a9e">ヒアリング後60分で初稿</text>
  <text x="1198" y="482" font-size="12" fill="#7a7a7e">対象:営業/提出前に本人が確認</text>

  <rect x="1120" y="540" width="400" height="104" rx="18" fill="#17151b" stroke="#3a342c" stroke-width="1.5"/>
  <rect x="1140" y="560" width="44" height="44" rx="11" fill="#2a1c0e"/>
  <text x="1155" y="592" font-size="24" font-weight="700" fill="#ff8a3d">?</text>
  <text x="1198" y="576" font-size="18" font-weight="700" fill="#f5f5f5">PJ-04 FAQ・社内ナレッジ</text>
  <text x="1198" y="598" font-size="13" fill="#9a9a9e">頻出質問を根拠付きで整理</text>
  <text x="1198" y="618" font-size="12" fill="#7a7a7e">対象:管理部門/責任者が承認</text>

  <rect x="1120" y="662" width="400" height="104" rx="18" fill="#17151b" stroke="#3a342c" stroke-width="1.5"/>
  <rect x="1140" y="682" width="44" height="44" rx="11" fill="#2a1c0e"/>
  <rect x="1150" y="692" width="24" height="17" rx="2" fill="none" stroke="#ff8a3d" stroke-width="2.2"/>
  <path d="M 1150 692 L 1162 702 L 1174 692" fill="none" stroke="#ff8a3d" stroke-width="2.2"/>
  <text x="1198" y="698" font-size="18" font-weight="700" fill="#f5f5f5">PJ-05 返信メール下書き</text>
  <text x="1198" y="720" font-size="13" fill="#9a9a9e">確認ルールに沿う返信案</text>
  <text x="1198" y="740" font-size="12" fill="#7a7a7e">対象:問合せ担当/送信前に確認</text>
</g>

<line x1="80" y1="830" x2="1520" y2="830" stroke="#232326" stroke-width="1"/>
<text x="80" y="868" font-family="sans-serif" font-size="15" fill="#c9c3ba">なぜPJ-01〜05から始めるか:商品の核であり、ここが固まる前に営業資料やサイトを作ると</text>
<text x="80" y="892" font-family="sans-serif" font-size="15" fill="#c9c3ba">変更のたびに手戻りが出ます。先に5PJで同じ型が出せる状態を作り切ります。</text>
<text x="80" y="928" font-family="sans-serif" font-size="14" fill="#7a7a7e">すべて下書きです。契約・金額・法務・個人情報に関わる最終判断は必ず人が行います。</text>

<rect x="930" y="850" width="590" height="94" rx="18" fill="#171310" stroke="#ff8a3d" stroke-width="1.5"/>
<circle cx="966" cy="879" r="17" fill="#2a1c0e"/>
<text x="966" y="886" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#ff8a3d">?</text>
<text x="996" y="882" font-family="sans-serif" font-size="16" font-weight="700" fill="#f5f5f5">追加要件は、企画書・追加提案書として整理する運用でよいか？</text>
<text x="954" y="914" font-family="sans-serif" font-size="14" fill="#c9c3ba">標準範囲／費用／納期／承認者を明記し、人の合意後に着手する。</text>
</svg>
