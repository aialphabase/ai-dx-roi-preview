  <text x="502" y="886" font-family="sans-serif" font-size="13" fill="#c9c3ba">会議責任者が承認前に確かめる</text>
  <text x="502" y="906" font-family="sans-serif" font-size="13" fill="#c9c3ba">受け手視点のチェック(図あり)</text>
  <text x="502" y="930" font-family="sans-serif" font-size="12" fill="#7d9a84">そろっている</text>

  <rect x="870" y="810" width="375" height="130" rx="12" fill="#1c1a15"/>
  <circle cx="896" cy="846" r="7" fill="#e6c34a"/>
  <text x="914" y="851" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">QA-0X 手動再監査プロンプト</text>
  <text x="892" y="886" font-family="sans-serif" font-size="13" fill="#c9c3ba">5PJ分。人が個別に再監査を</text>
  <text x="892" y="906" font-family="sans-serif" font-size="13" fill="#c9c3ba">依頼するときに使用</text>
  <text x="892" y="930" font-family="sans-serif" font-size="12" font-weight="700" fill="#d9c07a">設計済・実データ未検証</text>

  <rect x="1260" y="810" width="375" height="130" rx="12" fill="#1c1a15"/>
  <circle cx="1286" cy="846" r="7" fill="#e6c34a"/>
  <text x="1304" y="851" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">PJ-01 再現性テスト</text>
  <text x="1282" y="886" font-family="sans-serif" font-size="13" fill="#c9c3ba">ゴールデンテスト4系統</text>
  <text x="1282" y="906" font-family="sans-serif" font-size="13" fill="#c9c3ba">(正常・不足・矛盾・リスク)</text>
  <text x="1282" y="930" font-family="sans-serif" font-size="12" font-weight="700" fill="#d9c07a">設計のみ・未実施</text>

  <!-- ============ Band 4: 運用ルール・法務 ============ -->
  <rect x="60" y="985" width="1680" height="225" rx="18" fill="#131316" stroke="#2c2c31" stroke-width="1"/>
  <text x="90" y="1030" font-family="sans-serif" font-size="19" font-weight="700" fill="#ff8a3d">④ 運用ルール・法務 ― 安全に使うために顧客へ渡す</text>

  <rect x="90" y="1055" width="760" height="130" rx="12" fill="#15201a"/>
  <circle cx="118" cy="1091" r="8" fill="#7fc98b"/>
  <text x="138" y="1096" font-family="sans-serif" font-size="16" font-weight="700" fill="#f5f5f5">AI利用ルール(標準雛形 + 顧客向けマニュアル)</text>
  <text x="138" y="1127" font-family="sans-serif" font-size="13" fill="#c9c3ba">社内用語・禁止表現・保存先・承認済みの文字起こし経路などを案件開始時に設定</text>
  <text x="138" y="1163" font-family="sans-serif" font-size="13" font-weight="700" fill="#7d9a84">そろっている(draft) ― 運用開始タイミングはPM未判定</text>

  <rect x="880" y="1055" width="760" height="130" rx="12" fill="#15201a"/>
  <circle cx="908" cy="1091" r="8" fill="#7fc98b"/>
  <text x="928" y="1096" font-family="sans-serif" font-size="16" font-weight="700" fill="#f5f5f5">音声データ取扱いと同意(顧客向け)</text>
  <text x="928" y="1127" font-family="sans-serif" font-size="13" fill="#c9c3ba">会議の録音をAIに渡すことへの参加者の同意(人手確認チェック1に対応)</text>
  <text x="928" y="1163" font-family="sans-serif" font-size="13" font-weight="700" fill="#7d9a84">そろっている(draft)</text>

