name: asset-map-nightly
on:
  # 予約は Xserver cron（平日22:47 JST・~/mirai-ops/trigger_asset_map.sh）から workflow_dispatch で起動する。
  # GitHub の schedule は5〜9時間遅れたため 2026-11-12 に外した。
  workflow_dispatch:          # Xserver cron と手動実行（Actionsタブ）
permissions:
  contents: write
concurrency:
  group: asset-map-nightly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run nightly update
        env:
          ASSET_MAP_MODE: ${{ vars.ASSET_MAP_MODE || 'dry' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
        run: python scripts/update_asset_map.py
      - name: Commit drafts
        run: |
          git config user.name  "asset-map-bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/out
          git diff --cached --quiet || git commit -m "asset-map nightly $(date -u +%F)"
          git push
