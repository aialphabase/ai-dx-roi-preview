<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teamプラン契約・メンバー招待</title>
<style>body{margin:0;background:#f7f5f0;color:#26302b;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}.wrap{padding:22px}.ey{font-size:11px;letter-spacing:.16em;color:#b08a4f;font-weight:700}h1{font-size:22px;line-height:1.35;margin:8px 0}.lead{color:#6e7a72;margin:0 0 18px}.box{background:#fff;border:1px solid #e3dfd6;border-radius:12px;padding:16px;margin:12px 0}.tag{display:inline-block;background:#e7eee9;color:#244d3e;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;margin-bottom:8px}.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#244d3e;color:#fff;font-weight:700;font-size:12px;margin-right:7px}.note{font-size:12px;color:#6e7a72}</style>
<body><main class="wrap"><div class="ey">OPTIONAL SETUP</div><h1>Teamプラン契約・メンバー招待</h1><p class="lead">Teamプランは標準導入の前提ではありません。導入を決めた企業のみ、管理者が実施します。</p><section class="box"><span class="tag">管理者操作</span><br><b><span class="num">1</span>契約とワークスペースを準備</b><p class="note">契約条件・管理者・利用者の範囲を社内で確認してから設定します。</p></section><section class="box"><b><span class="num">2</span>対象メンバーを招待</b><p class="note">招待後、各メンバーが参加できることを確認します。</p></section><section class="box"><b><span class="num">3</span>必要になった段階で共有運用を検証</b><p class="note">組織での共有設定は、実機検証後に標準化の可否を判断します。</p></section></main></body></html>
